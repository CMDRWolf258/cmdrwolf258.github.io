name: Curated POI compatibility checks

on:
  pull_request:
    paths:
      - 'functions/api/mining.js'
      - 'functions/api/hud/mining-report.js'
      - 'scripts/test-mining-navigation.mjs'
      - 'scripts/test-mining-backend.mjs'
      - 'mining-admin.html'
      - 'lib/mining-navigation.js'
      - 'lib/mining-multisystem.js'
      - 'scripts/test-mining-multisystem.mjs'
      - 'lib/mining-diagnostics.js'
      - 'lib/mining-schema.js'
      - 'scripts/test-mining-query-cost.py'
      - 'scripts/fixtures/mining-query-before.sql'
      - 'functions/api/admin/mining-reports/[id]/duplicate.js'
      - 'functions/api/admin/mining-reports.js'
      - 'functions/api/mining-centers.js'
      - 'functions/api/mining-systems.js'
      - 'functions/api/hud/mining-multi-health.js'
      - 'scripts/test-mining-multi-health.mjs'
      - 'functions/api/hud/mining-center.js'
      - 'functions/api/admin/mining-multi-reports.js'
      - 'lib/curated-poi.js'
      - 'lib/mining-material.js'
      - 'curated-mining.js'
      - 'mining-database.js'
      - 'scripts/test-curated-poi.mjs'
      - '.github/workflows/curated-poi-tests.yml'
  push:
    branches: [main]
    paths:
      - 'functions/api/mining.js'
      - 'functions/api/hud/mining-report.js'
      - 'functions/api/hud/mining-center.js'
      - 'functions/api/admin/mining-multi-reports.js'
      - 'functions/api/mining-centers.js'
      - 'functions/api/mining-systems.js'
      - 'functions/api/hud/mining-multi-health.js'
      - 'scripts/test-mining-multi-health.mjs'
      - 'lib/mining-navigation.js'
      - 'lib/mining-multisystem.js'
      - 'scripts/test-mining-multisystem.mjs'
      - 'lib/mining-diagnostics.js'
      - 'lib/mining-schema.js'
      - 'scripts/test-mining-query-cost.py'
      - 'scripts/fixtures/mining-query-before.sql'
      - 'scripts/test-mining-navigation.mjs'
      - 'scripts/test-mining-backend.mjs'
      - 'lib/curated-poi.js'
      - 'lib/mining-material.js'
      - 'curated-mining.js'
      - 'mining-database.js'
      - 'scripts/test-curated-poi.mjs'
      - '.github/workflows/curated-poi-tests.yml'

jobs:
  curated-poi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify curated provider and legacy compatibility
        run: node --experimental-default-type=module --test scripts/test-curated-poi.mjs
      - name: Verify HUD mining endpoint syntax
        run: |
          node --check functions/api/hud/mining-report.js
          node --check lib/mining-multisystem.js
          node --check functions/api/hud/mining-center.js
          node --check functions/api/admin/mining-multi-reports.js
          node --check functions/api/mining-centers.js
          node --check functions/api/mining-systems.js
          node --check functions/api/hud/mining-multi-health.js
          node --check functions/api/admin/mining-reports.js
          node --check 'functions/api/admin/mining-reports/[id]/duplicate.js'
      - name: Verify mining navigation and duplicate threshold
        run: node --experimental-default-type=module --test scripts/test-mining-navigation.mjs
      - name: Verify D1 diagnostics and shared center persistence
        run: node --experimental-default-type=module --test scripts/test-mining-backend.mjs
      - name: Verify additive multi-system records and identity isolation
        run: node --experimental-default-type=module --test scripts/test-mining-multisystem.mjs
      - name: Verify read-only production mining health checks
        run: node --experimental-default-type=module --test scripts/test-mining-multi-health.mjs
      - name: Verify mining output equivalence and query read cost
        run: python scripts/test-mining-query-cost.py
