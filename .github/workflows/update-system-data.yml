name: Update 10-16 System Data

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-system-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch latest system data
        run: |
          mkdir -p data

          curl --fail --silent --show-error \
            "https://spansh.co.uk/api/system/560820275507" \
            -o spansh-system.json

          curl --fail --silent --show-error \
            --get \
            --data-urlencode "systemName=NGC 2546 Sector UZ-G d10-16" \
            "https://www.edsm.net/api-system-v1/factions" \
            -o edsm-factions.json

          python3 <<'PY'
          import json
          from datetime import datetime, timezone

          # -------------------------
          # SPANSH SYSTEM DATA
          # -------------------------

          with open("spansh-system.json", "r", encoding="utf-8") as f:
              raw = json.load(f)

          if isinstance(raw.get("record"), dict):
              system = raw["record"]
          elif isinstance(raw.get("system"), dict):
              system = raw["system"]
          else:
              system = raw

          population = system.get("population")

          print("System keys:")
          print(list(system.keys()))

          print("Stations field:")
          print(system.get("stations"))

          stations = system.get("stations") or []

          print("Permanent stations with markets:")

          for station in stations:
            if (
              station.get("has_market")
              and station.get("type") != "Drake-Class Carrier"
            ):
              print(
                  station.get("name"),
                  "|",
                  station.get("type"),
                  "| market_id:",
                  station.get("market_id")
              )
                    import urllib.request
          import time

          # -------------------------
          # MARKET DATA
          # -------------------------

          best_markets = {}

          permanent_market_stations = [
              station
              for station in stations
              if (
                  station.get("has_market")
                  and station.get("market_id")
                  and station.get("type") != "Drake-Class Carrier"
              )
          ]

          print(
              "Checking",
              len(permanent_market_stations),
              "permanent station markets"
          )

          for station in permanent_market_stations:

              station_name = station.get("name")
              market_id = station.get("market_id")

              station_url = (
                  f"https://spansh.co.uk/api/station/{market_id}"
              )

              try:

                  with urllib.request.urlopen(
                      station_url,
                      timeout=30
                  ) as response:
                      station_response = json.load(response)

                  station_record = (
                      station_response.get("record")
                      or {}
                  )

                  market = (
                      station_record.get("market")
                      or []
                  )

                  market_updated = (
                      station_record.get("market_updated_at")
                      or station_record.get("market_updated")
                      or station_record.get("updated_at")
                  )

                  print(
                      station_name,
                      "| commodities:",
                      len(market)
                  )

                  for commodity in market:

                      commodity_name = (
                          commodity.get("commodity")
                      )

                      sell_price = (
                          commodity.get("sell_price")
                          or 0
                      )

                      demand = (
                          commodity.get("demand")
                          or 0
                      )

                      if (
                          not commodity_name
                          or sell_price <= 0
                          or demand <= 0
                      ):
                          continue

                      current_best = (
                          best_markets.get(
                              commodity_name
                          )
                      )

                      if (
                          current_best is None
                          or sell_price
                          > current_best["price"]
                      ):

                          best_markets[
                              commodity_name
                          ] = {
                              "price": sell_price,
                              "station": station_name,
                              "demand": demand,
                              "marketId": market_id,
                              "marketUpdated": market_updated
                          }

                  time.sleep(0.1)

              except Exception as error:

                  print(
                      "Market fetch failed:",
                      station_name,
                      error
                  )

          market_output = {
              "system": "NGC 2546 Sector UZ-G d10-16",
              "generatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),
              "commodities": best_markets
          }

          with open(
              "data/market.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  market_output,
                  f,
                  indent=2
              )

          print(
              "Saved best prices for",
              len(best_markets),
              "commodities"
          )
          if population is None:
              raise RuntimeError(
                  "Population was not found in the Spansh response."
              )

          # -------------------------
          # EDSM FACTION DATA
          # -------------------------

          with open("edsm-factions.json", "r", encoding="utf-8") as f:
              edsm = json.load(f)

          controlling_raw = edsm.get("controllingFaction") or {}

          controlling_faction = controlling_raw.get("name")

          factions_raw = edsm.get("factions") or []

          factions = []

          for faction in factions_raw:
              name = faction.get("name")

              if not name:
                  continue

              influence = faction.get("influence")
              state = faction.get("state") or "None"

              factions.append({
                  "name": name,
                  "influence": influence,
                  "state": state,
                  "allegiance": faction.get("allegiance"),
                  "government": faction.get("government"),
                  "isPlayer": faction.get("isPlayer", False),
                  "controlling": name == controlling_faction
              })

          factions.sort(
              key=lambda f: (
                  not f["controlling"],
                  -(f["influence"] or 0)
              )
          )

          # -------------------------
          # SAVE WEBSITE DATA
          # -------------------------

          output = {
              "population": population,
              "controllingFaction": controlling_faction,
              "factions": factions,
              "lastUpdated": datetime.now(timezone.utc).isoformat()
          }

          with open("data/system.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2)

          print("Population:", population)
          print("Controlling faction:", controlling_faction)
          print("Faction count:", len(factions))

          for faction in factions:
              print(
                  faction["name"],
                  faction["influence"],
                  faction["state"]
              )
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/system.json

          if git diff --cached --quiet; then
            echo "No system data changes to commit."
          else
            git commit -m "Update live system data"
            git push
          fi
